{
"name": "Atualizar precos",
"on": {"schedule": [{"cron": "30 21 * * 1-5"}], "workflow_dispatch": {}},
"permissions": {"contents": "write"},
"jobs": {"atualizar": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
{"name": "Instalar bibliotecas", "run": "pip install yfinance pandas"},
{"name": "Baixar precos", "run": "python scripts/atualizar.py"},
{"name": "Salvar alteracoes", "run": "git config user.name robo-precos && git config user.email robo-precos@users.noreply.github.com && git add data && (git diff --staged --quiet || git commit -m 'Atualiza precos') && git push"}
]}}
}
