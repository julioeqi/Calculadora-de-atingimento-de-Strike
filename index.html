<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de atingimento de strike</title>
<style>
body{font-family:Aeonik,Arial,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;color:#1a1a1a;background:#fff}
h1{font-size:22px}
h2{font-size:17px;margin-top:32px;border-top:1px solid #ccc;padding-top:20px}
label{display:block;margin-top:14px;font-weight:bold;font-size:14px}
select,input{width:100%;padding:10px;font-size:16px;margin-top:4px;box-sizing:border-box}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.card{background:#f1f3f5;border-radius:8px;padding:12px;text-align:center}
.card b{display:block;font-size:24px;margin-top:4px}
.res{background:#f1f3f5;border-radius:8px;padding:12px;margin-top:10px}
.res b{font-size:24px}
.res span{display:block;font-size:13px;color:#555;margin-top:4px}
button{margin-top:18px;padding:12px;font-size:16px;width:100%;cursor:pointer}
.nota{font-size:13px;color:#555;margin-top:16px;line-height:1.5}
.hb{fill:#2e9e5b}
.hb.ok{fill:#d64545}
#histo svg{margin-top:20px}
#histo text{fill:currentColor;font-size:11px}
@media (prefers-color-scheme:dark){
body{background:#1b1b1b;color:#eee}
h2{border-top-color:#444}
select,input{background:#2a2a2a;color:#eee;border:1px solid #555}
.card,.res{background:#2a2a2a}
.res span{color:#aaa}
.nota{color:#aaa}
}
</style>
</head>
<body>
<h1>Calculadora de atingimento de strike</h1>

<label>Ativo</label>
<select id="ativo"></select>

<label>Tempo (período do histórico analisado)</label>
<select id="tempo">
<option value="1">Último 1 ano</option>
<option value="3">Últimos 3 anos</option>
<option value="5">Últimos 5 anos</option>
<option value="10">Últimos 10 anos</option>
<option value="0" selected>Todo o histórico</option>
</select>

<h2 id="titulo">Backtest de retorno em 30 dias</h2>

<label>Janela (dias corridos)</label>
<select id="janela">
<option value="30" selected>30 dias</option>
<option value="60">60 dias</option>
<option value="90">90 dias</option>
<option value="0">Outro</option>
</select>
<input id="janelaOutro" type="number" min="1" max="365" step="1" placeholder="Ex.: 45" style="display:none">

<label>Retorno no fim da janela (%)</label>
<input id="pct" type="number" step="0.5" value="5">

<div class="cards">
<div class="card">Janelas analisadas<b id="total">-</b></div>
<div class="card">Atingiu o retorno<b id="atingiu">-</b></div>
<div class="card">% das vezes<b id="taxa">-</b></div>
</div>

<div id="histo"></div>

<button id="baixar">Baixar CSV de conferência</button>

<h2>Contagem de dias por preço de fechamento</h2>

<label>Acima de (R$): dias em que o fechamento ficou acima</label>
<input id="acima" type="text" inputmode="decimal" placeholder="Ex.: 15,00">
<div class="res"><b id="cntAcima">-</b><span id="infoAcima">Digite um valor.</span></div>

<label>Abaixo de (R$): dias em que o fechamento ficou abaixo</label>
<input id="abaixo" type="text" inputmode="decimal" placeholder="Ex.: 10,00">
<div class="res"><b id="cntAbaixo">-</b><span id="infoAbaixo">Digite um valor.</span></div>

<p class="nota" id="nota"></p>

<script>
var TICKERS = [ "ABEV3", "ALOS3", "ASAI3", "AURE3", "AXIA3", "AZZA3",
    "B3SA3", "BBAS3", "BBDC3", "BBDC4", "BBSE3", "BPAC11",
    "BRAP4", "BRAV3", "CEAB3", "CMIG4", "COGN3", "CPLE3",
    "CSMG3", "CXSE3", "ELET3", "ELET6", "EMBR3", "ENEV3",
    "EGIE3", "EQTL3", "FLRY3", "GGBR4", "GOAU4", "HAPV3",
    "HYPE3", "ITSA4", "ITUB4", "JBSS3", "KLBN11", "LREN3",
    "MGLU3", "MRFG3", "MULT3", "PETR3", "PETR4", "PRIO3",
    "RADL3", "RAIL3", "RAIZ4", "RDOR3", "RENT3", "SANB11",
    "SBSP3", "SLCE3", "SUZB3", "TAEE11", "TIMS3", "TOTS3",
    "UGPA3", "USIM5", "VALE3", "VBBR3", "VIVA3", "WEGE3",
    "YDUQ3" ];
var DIA = 86400000;
var cache = {};
var ultimas = [];
var tickerAtual = "";

function lerPrazo() {
  var escolha = document.getElementById("janela").value;
  var outro = document.getElementById("janelaOutro");
  outro.style.display = escolha === "0" ? "block" : "none";
  return escolha === "0" ? parseInt(outro.value, 10) : parseInt(escolha, 10);
}

function carregar(ticker) {
  if (cache[ticker]) return Promise.resolve(cache[ticker]);
  return fetch("data/" + ticker + ".csv?v=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("Arquivo não encontrado");
      return r.text();
    })
    .then(function (txt) {
      var linhas = txt.trim().split("\n");
      var datas = [], precos = [];
      for (var i = 0; i < linhas.length; i++) {
        var p = linhas[i].trim().split(",");
        if (!/^\d{4}-\d{2}-\d{2}$/.test(p[0])) continue;
        var v = parseFloat(p[1]);
        if (isNaN(v)) continue;
        datas.push(Date.parse(p[0] + "T00:00:00Z"));
        precos.push(v);
      }
      cache[ticker] = { datas: datas, precos: precos };
      return cache[ticker];
    });
}

function fmtData(ms) {
  var d = new Date(ms);
  return String(d.getUTCDate()).padStart(2, "0") + "/" +
         String(d.getUTCMonth() + 1).padStart(2, "0") + "/" + d.getUTCFullYear();
}

function num(x) {
  return x.toFixed(2).replace(".", ",");
}

function f2(x) {
  return String(Math.round(x * 100) / 100).replace(".", ",");
}

function lerValor(id) {
  var t = document.getElementById(id).value.trim().replace(",", ".");
  if (t === "") return NaN;
  return parseFloat(t);
}

function contar(datas, precos, inicio) {
  var acima = lerValor("acima");
  var abaixo = lerValor("abaixo");
  var dias = 0, nAcima = 0, nAbaixo = 0, ultAcima = null, ultAbaixo = null;

  for (var i = 0; i < datas.length; i++) {
    if (datas[i] < inicio) continue;
    dias++;
    if (!isNaN(acima) && precos[i] > acima) { nAcima++; ultAcima = datas[i]; }
    if (!isNaN(abaixo) && precos[i] < abaixo) { nAbaixo++; ultAbaixo = datas[i]; }
  }

  var pctDias = function (n) { return dias ? (n / dias * 100).toFixed(1) + "%" : "-"; };

  if (isNaN(acima)) {
    document.getElementById("cntAcima").textContent = "-";
    document.getElementById("infoAcima").textContent = "Digite um valor.";
  } else {
    document.getElementById("cntAcima").textContent = nAcima + " dias";
    document.getElementById("infoAcima").textContent =
      "Fechou acima de R$ " + num(acima) + " em " + nAcima + " de " + dias +
      " pregões (" + pctDias(nAcima) + ")." +
      (ultAcima ? " Última vez: " + fmtData(ultAcima) + "." : "");
  }

  if (isNaN(abaixo)) {
    document.getElementById("cntAbaixo").textContent = "-";
    document.getElementById("infoAbaixo").textContent = "Digite um valor.";
  } else {
    document.getElementById("cntAbaixo").textContent = nAbaixo + " dias";
    document.getElementById("infoAbaixo").textContent =
      "Fechou abaixo de R$ " + num(abaixo) + " em " + nAbaixo + " de " + dias +
      " pregões (" + pctDias(nAbaixo) + ")." +
      (ultAbaixo ? " Última vez: " + fmtData(ultAbaixo) + "." : "");
  }
}

function desenharHistograma(rets, pct, prazo) {
  var el = document.getElementById("histo");
  if (!rets.length) { el.innerHTML = ""; return; }

  var mn = rets[0], mx = rets[0], i, k;
  for (i = 1; i < rets.length; i++) {
    if (rets[i] < mn) mn = rets[i];
    if (rets[i] > mx) mx = rets[i];
  }
  var lo = Math.min(mn, pct), hi = Math.max(mx, pct);

  var passos = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100];
  var passo = passos[passos.length - 1];
  for (k = 0; k < passos.length; k++) {
    if (passos[k] >= (hi - lo) / 24) { passo = passos[k]; break; }
  }

  var ini = pct + Math.floor((lo - pct) / passo + 1e-9) * passo;
  var nb = Math.floor((hi - ini) / passo + 1e-9) + 1;
  var cont = [];
  for (i = 0; i < nb; i++) cont.push(0);
  for (i = 0; i < rets.length; i++) {
    cont[Math.floor((rets[i] - ini) / passo + 1e-9)]++;
  }
  var maxC = Math.max.apply(null, cont);

  var W = 640, H = 260, ml = 40, mr = 10, mt = 14, mb = 34;
  var iw = W - ml - mr, ih = H - mt - mb, bw = iw / nb;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Histograma dos retornos">';

  for (i = 0; i < nb; i++) {
    var h = cont[i] / maxC * ih;
    var x = ml + i * bw;
    var borda = ini + i * passo;
    var ok = borda >= pct - 1e-9;
    s += '<rect class="hb' + (ok ? ' ok' : '') + '" x="' + x.toFixed(1) +
         '" y="' + (mt + ih - h).toFixed(1) + '" width="' + Math.max(bw - 1, 1).toFixed(1) +
         '" height="' + h.toFixed(1) + '"><title>' + f2(borda) + '% a ' + f2(borda + passo) +
         '%: ' + cont[i] + ' janelas</title></rect>';
  }

  s += '<line x1="' + ml + '" y1="' + (mt + ih) + '" x2="' + (W - mr) + '" y2="' + (mt + ih) +
       '" stroke="currentColor" stroke-width="1"/>';
  s += '<text x="' + (ml - 6) + '" y="' + (mt + ih + 4) + '" text-anchor="end">0</text>';
  s += '<text x="' + (ml - 6) + '" y="' + (mt + 8) + '" text-anchor="end">' + maxC + '</text>';

  var cada = Math.ceil(nb / 8);
  for (i = 0; i <= nb; i += cada) {
    s += '<text x="' + (ml + i * bw).toFixed(1) + '" y="' + (mt + ih + 16) +
         '" text-anchor="middle">' + f2(ini + i * passo) + '%</text>';
  }

  var xp = ml + (pct - ini) / passo * bw;
  s += '<line x1="' + xp.toFixed(1) + '" y1="' + mt + '" x2="' + xp.toFixed(1) + '" y2="' + (mt + ih) +
       '" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>';
  s += '</svg>';

  el.innerHTML = s +
    '<p class="nota">Retorno em ' + prazo + ' dias. Cada barra cobre ' + f2(passo) +
    ' ponto(s) percentual(is) e mostra quantas janelas caíram naquela faixa. ' +
    'A linha tracejada marca ' + f2(pct) + '%; as barras verdes são as janelas em que não seria exercido e as vermelhar, quando exercido.</p>';
}

function calcular() {
  var ticker = document.getElementById("ativo").value;
  var anos = parseInt(document.getElementById("tempo").value, 10);
  var pct = parseFloat(document.getElementById("pct").value);
  var nota = document.getElementById("nota");
  var prazo = lerPrazo();

  carregar(ticker).then(function (d) {
    var datas = d.datas, precos = d.precos, n = datas.length;
    var ultima = datas[n - 1];
    var inicio = anos === 0 ? datas[0] : ultima - anos * 365.25 * DIA;

    contar(datas, precos, inicio);

    if (isNaN(pct)) { nota.textContent = "Digite um percentual."; return; }
    if (isNaN(prazo) || prazo < 1) { nota.textContent = "Digite uma janela de 1 dia ou mais."; return; }
    document.getElementById("titulo").textContent = "Backtest de retorno em " + prazo + " dias";

    var total = 0, atingiu = 0, j = 0;
    var linhas = [];
    var rets = [];

    for (var i = 0; i < n; i++) {
      if (datas[i] < inicio) continue;
      var alvo = datas[i] + prazo * DIA;
      if (alvo > ultima) break;
      if (j < i) j = i;
      while (j + 1 < n && datas[j + 1] <= alvo) j++;
      var strike = precos[i] * (1 + pct / 100);
      var ret = (precos[j] / precos[i] - 1) * 100;
      rets.push(ret);
      var bateu = precos[j] >= strike;
      total++;
      if (bateu) atingiu++;
      linhas.push([fmtData(datas[i]), num(precos[i]), num(strike), fmtData(alvo),
                   fmtData(datas[j]), num(precos[j]), num(ret), bateu ? "SIM" : "NAO"]);
    }

    ultimas = linhas;
    tickerAtual = ticker;
    document.getElementById("total").textContent = total;
    document.getElementById("atingiu").textContent = atingiu;
    document.getElementById("taxa").textContent =
      total ? (atingiu / total * 100).toFixed(1) + "%" : "-";
    desenharHistograma(rets, pct, prazo);
    nota.textContent = "Dados de " + fmtData(datas[0]) + " até " + fmtData(ultima) +
      ". Cada janela do backtest compara o fechamento do dia com o de " + prazo +
      " dias corridos depois (se não houver pregão, usa o último fechamento anterior) " +
      "e conta quando o retorno final é maior ou igual a " + pct + "%. " +
      "A contagem por preço usa o fechamento de cada pregão do período.";
  }).catch(function () {
    nota.textContent = "Não consegui carregar os dados de " + ticker + ".";
  });
}

function baixar() {
  if (!ultimas.length) { return; }
  var cab = ["data_inicio", "fechamento_inicio", "strike", "data_alvo",
             "data_fechamento_usado", "fechamento_final", "retorno_pct", "atingiu"];
  var txt = "\uFEFF" + cab.join(";") + "\n" +
            ultimas.map(function (l) { return l.join(";"); }).join("\n");
  var blob = new Blob([txt], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "conferencia_" + tickerAtual + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

var sel = document.getElementById("ativo");
TICKERS.forEach(function (t) {
  var o = document.createElement("option");
  o.value = t; o.textContent = t;
  sel.appendChild(o);
});
["ativo", "tempo", "janela"].forEach(function (id) {
  document.getElementById(id).addEventListener("change", calcular);
});
["pct", "acima", "abaixo", "janelaOutro"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", calcular);
});
document.getElementById("baixar").addEventListener("click", baixar);
calcular();
</script>
</body>
</html>
